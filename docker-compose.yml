services:
  postgres:
    image: postgres:17-alpine
    container_name: recoveriq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recoveriq
      POSTGRES_USER: recoveriq
      POSTGRES_PASSWORD: recoveriq_password
    ports:
      - "5432:5432"
    volumes:
      - recoveriq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveriq -d recoveriq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  recoveriq_postgres_data:
